services:
  app:
    build: .
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8701:8501"
    volumes:
      - ./sample.txt:/app/sample.txt
      - ./lab.py:/app/lab.py
      - ./ui.py:/app/ui.py
      - ./.env:/app/.env
      - hf_cache:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hf_cache:
